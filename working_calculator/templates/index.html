
<!DOCTYPE html>
<html>
<head>
    <title>My Calculator</title>

    <style>
        body {
            font-family: Arial;
            max-width: 460px;
            margin: 50px auto;
        }

        input, select, button {
            font-size: 18px;
            padding: 8px;
            margin: 4px 0;
        }

        .result {
            color: green;
            font-size: 24px;
            margin-top: 15px;
        }

        .error {
            color: red;
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>My Calculator</h1>

    <form method="POST">

        <input type="number" step="any" name="a" placeholder="First number" required>

        <select name="operation">
            <option value="add">+ Add</option>
            <option value="subtract">- Subtract</option>
            <option value="multiply">x Multiply</option>
            <option value="divide">/ Divide</option>
        </select>

        <input type="number" step="any" name="b" placeholder="Second number" required>

        <br><br>

        <button type="submit">Calculate</button>

    </form>

    {% if result is not none %}
        <div class="result">
            Answer: {{ result }}
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</body>
</html>
